services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: capsi_db
      MYSQL_USER: capsi_user
      MYSQL_PASSWORD: capsi_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: capsi_db
      WORDPRESS_DB_USER: capsi_user
      WORDPRESS_DB_PASSWORD: capsi_pass
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
    volumes:
      - ./theme:/var/www/html/wp-content/themes/capsi-theme
      - wp_data:/var/www/html
    depends_on:
      - db

  wpcli:
    image: wordpress:cli
    user: root
    volumes:
      - wp_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/capsi-theme
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: capsi_db
      WORDPRESS_DB_USER: capsi_user
      WORDPRESS_DB_PASSWORD: capsi_pass
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
    entrypoint: ["wp", "--allow-root"]

volumes:
  db_data:
  wp_data:
