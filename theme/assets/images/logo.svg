<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 345" role="img" aria-label="L'Atelier Capsi — Botanical Artisan Peppers">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Inter:wght@300&amp;display=swap');
    </style>

    <!-- Gradient principal : lumière gauche → ombre droite -->
    <linearGradient id="chiliBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#DE4040"/>
      <stop offset="28%"  stop-color="#C82A2B"/>
      <stop offset="68%"  stop-color="#9E1A1A"/>
      <stop offset="100%" stop-color="#6E0E0E"/>
    </linearGradient>

    <!-- Reflet radial : spot lumineux haut-gauche -->
    <radialGradient id="chiliSheen" cx="30%" cy="20%" r="48%" fx="30%" fy="20%">
      <stop offset="0%"   stop-color="#FF8080" stop-opacity="0.50"/>
      <stop offset="60%"  stop-color="#C82A2B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C82A2B" stop-opacity="0"/>
    </radialGradient>

    <!-- Assombrissement de la pointe -->
    <linearGradient id="chiliTip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="65%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Assombrissement épaule droite -->
    <radialGradient id="chiliShadow" cx="80%" cy="30%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ══ CALYX — couronne naturelle 5 sépales ══ -->
  <path fill="#2D4A3E"
        d="M188,88 C186,79 185,72 187,65 C189,70 190,79 188,88 Z"/>
  <path fill="#2D4A3E" fill-opacity="0.85"
        d="M184,88 C181,79 180,71 183,64 C184,70 185,79 184,88 Z"/>
  <path fill="#2D4A3E" fill-opacity="0.85"
        d="M192,88 C195,79 196,71 193,64 C192,70 191,79 192,88 Z"/>
  <path fill="#2D4A3E" fill-opacity="0.55"
        d="M180,87 C175,79 175,71 179,65 C181,71 181,80 180,87 Z"/>
  <path fill="#2D4A3E" fill-opacity="0.55"
        d="M196,87 C201,79 201,71 197,65 C195,71 195,80 196,87 Z"/>
  <!-- Base calyx -->
  <ellipse cx="188" cy="91" rx="9" ry="3.5" fill="#2D4A3E"/>
  <!-- Petit pédoncule -->
  <path fill="none" stroke="#2D4A3E" stroke-width="1.3" stroke-linecap="round"
        d="M188,64 C188,60 189,56 189,52"/>

  <!-- ══ CORPS DU PIMENT ══ -->

  <!-- 1. Forme de base avec dégradé lumière/ombre -->
  <path fill="url(#chiliBody)"
        d="M183,94
           C174,102 170,118 170,136
           C170,156 173,177 177,196
           C180,211 184,227 187,246
           C190,228 194,212 197,197
           C201,178 203,157 202,137
           C201,119 198,103 183,94
           Z"/>

  <!-- 2. Reflet lumineux (même chemin, remplissage radial semi-transparent) -->
  <path fill="url(#chiliSheen)"
        d="M183,94
           C174,102 170,118 170,136
           C170,156 173,177 177,196
           C180,211 184,227 187,246
           C190,228 194,212 197,197
           C201,178 203,157 202,137
           C201,119 198,103 183,94
           Z"/>

  <!-- 3. Assombrissement pointe -->
  <path fill="url(#chiliTip)"
        d="M183,94
           C174,102 170,118 170,136
           C170,156 173,177 177,196
           C180,211 184,227 187,246
           C190,228 194,212 197,197
           C201,178 203,157 202,137
           C201,119 198,103 183,94
           Z"/>

  <!-- 4. Ombre supplémentaire épaule droite -->
  <path fill="url(#chiliShadow)"
        d="M183,94
           C174,102 170,118 170,136
           C170,156 173,177 177,196
           C180,211 184,227 187,246
           C190,228 194,212 197,197
           C201,178 203,157 202,137
           C201,119 198,103 183,94
           Z"/>

  <!-- 5. Plis longitudinaux subtils -->
  <path fill="none" stroke="#6B0A0A" stroke-width="0.6" stroke-opacity="0.22"
        stroke-linecap="round"
        d="M185,102 C183,120 182,142 183,164 C184,182 185,200 186,218"/>
  <path fill="none" stroke="#6B0A0A" stroke-width="0.5" stroke-opacity="0.16"
        stroke-linecap="round"
        d="M191,100 C193,120 194,144 193,166 C192,186 191,204 190,222"/>

  <!-- 6. Petit spot spéculaire haut-gauche -->
  <ellipse cx="177" cy="114" rx="4.5" ry="8"
           fill="rgba(255,210,210,0.32)"
           transform="rotate(-15,177,114)"/>

  <!-- Contour très léger pour définir les bords -->
  <path fill="none" stroke="#7A0F0F" stroke-width="0.5" stroke-opacity="0.30"
        stroke-linecap="round" stroke-linejoin="round"
        d="M183,94
           C174,102 170,118 170,136
           C170,156 173,177 177,196
           C180,211 184,227 187,246
           C190,228 194,212 197,197
           C201,178 203,157 202,137
           C201,119 198,103 183,94
           Z"/>

  <!-- ══ SEPARATOR ══ -->
  <line x1="148" y1="263" x2="232" y2="263"
        stroke="#2D4A3E" stroke-width="0.7" opacity="0.4"/>
  <circle cx="190" cy="263" r="2.8" fill="#C82A2B"/>

  <!-- ══ TYPOGRAPHY ══ -->
  <text x="190" y="294"
        font-family="'Cormorant Garamond', Garamond, 'Times New Roman', serif"
        font-size="30" font-weight="600"
        fill="#2D4A3E" text-anchor="middle" letter-spacing="7">
    L'ATELIER CAPSI
  </text>

  <line x1="105" y1="303" x2="275" y2="303"
        stroke="#2D4A3E" stroke-width="0.5" opacity="0.25"/>

  <text x="190" y="323"
        font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" font-weight="300"
        fill="#2D4A3E" text-anchor="middle" letter-spacing="4.5">
    BOTANICAL ARTISAN PEPPERS
  </text>
</svg>
