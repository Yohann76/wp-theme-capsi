<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="L'Atelier Capsi">
  <defs>
    <linearGradient id="pG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F07828"/>
      <stop offset="35%"  stop-color="#D94820"/>
      <stop offset="70%"  stop-color="#C02820"/>
      <stop offset="100%" stop-color="#881010"/>
    </linearGradient>
    <radialGradient id="pS" cx="28%" cy="25%" r="55%">
      <stop offset="0%"   stop-color="#FFAA60" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D94820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6AAA78"/>
      <stop offset="100%" stop-color="#3A6848"/>
    </linearGradient>
    <linearGradient id="lH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#88C890"/>
      <stop offset="100%" stop-color="#4E8858"/>
    </linearGradient>
  </defs>

  <!-- ══ TRONC UNIQUE ══ -->
  <path d="M 100,236 C 100,218 100,196 100,154"
        fill="none" stroke="#4E8A62" stroke-width="5.5" stroke-linecap="round"/>

  <!-- ══ FLEUR À LA FOURCHE — symbole de l'union des deux côtés ══ -->
  <ellipse cx="100" cy="132" rx="3"   ry="5"   fill="#F5F0E5" stroke="#D0C8B8" stroke-width="0.45" opacity="0.92"/>
  <ellipse cx="108" cy="135" rx="3"   ry="5"   fill="#F5F0E5" stroke="#D0C8B8" stroke-width="0.45" opacity="0.92" transform="rotate(72,108,135)"/>
  <ellipse cx="104" cy="146" rx="3"   ry="5"   fill="#F5F0E5" stroke="#D0C8B8" stroke-width="0.45" opacity="0.92" transform="rotate(144,104,146)"/>
  <ellipse cx="96"  cy="146" rx="3"   ry="5"   fill="#F5F0E5" stroke="#D0C8B8" stroke-width="0.45" opacity="0.92" transform="rotate(216,96,146)"/>
  <ellipse cx="92"  cy="135" rx="3"   ry="5"   fill="#F5F0E5" stroke="#D0C8B8" stroke-width="0.45" opacity="0.92" transform="rotate(288,92,135)"/>
  <circle cx="100" cy="140" r="5"   fill="#E8C840" opacity="0.95"/>
  <circle cx="100" cy="140" r="2.5" fill="#C89420"/>
  <circle cx="100" cy="132" r="1"   fill="#E8C840" opacity="0.8"/>
  <circle cx="107" cy="135" r="1"   fill="#E8C840" opacity="0.8"/>
  <circle cx="104" cy="145" r="1"   fill="#E8C840" opacity="0.8"/>
  <circle cx="96"  cy="145" r="1"   fill="#E8C840" opacity="0.8"/>
  <circle cx="93"  cy="135" r="1"   fill="#E8C840" opacity="0.8"/>

  <!-- ══════════════════════════════════════════
       CÔTÉ GAUCHE — PIMENT (Capsicum)
       Feuilles larges, piments habanero qui pendent
       ══════════════════════════════════════════ -->

  <!-- Bras principal gauche (100,154 → 68,96) -->
  <path d="M 100,154 C 90,136 78,116 68,96"
        fill="none" stroke="#4E8A62" stroke-width="3.8" stroke-linecap="round"/>
  <!-- Extension haute-gauche (68,96 → 56,44) -->
  <path d="M 68,96 C 65,78 61,62 56,44"
        fill="none" stroke="#4E8A62" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sous-branche basse-gauche (68,96 → 30,80) -->
  <path d="M 68,96 C 54,90 42,84 30,80"
        fill="none" stroke="#4E8A62" stroke-width="2.2" stroke-linecap="round"/>

  <!-- GRANDES FEUILLES côté piment -->

  <!-- Feuille large à (68,96) — pointe bas-gauche -->
  <path d="M 68,96 C 50,102 26,114 10,120 C 22,128 48,114 68,96 Z"
        fill="url(#lP)" stroke="#3A6848" stroke-width="0.8"/>
  <line x1="68" y1="96" x2="13" y2="119" stroke="#2A5035" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M 46,110 L 28,117" fill="none" stroke="#2A5035" stroke-width="0.4" stroke-linecap="round"/>

  <!-- Feuille large à (68,96) — pointe haut-gauche -->
  <path d="M 68,96 C 50,90 26,82 10,84 C 22,92 48,100 68,96 Z"
        fill="url(#lP)" stroke="#3A6848" stroke-width="0.8"/>
  <line x1="68" y1="96" x2="13" y2="84" stroke="#2A5035" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M 44,90 L 26,85" fill="none" stroke="#2A5035" stroke-width="0.4" stroke-linecap="round"/>

  <!-- Feuille intermédiaire à ~(62,68) -->
  <path d="M 62,70 C 48,66 30,60 16,62 C 26,70 46,74 62,70 Z"
        fill="url(#lP)" stroke="#3A6848" stroke-width="0.7"/>
  <line x1="62" y1="70" x2="19" y2="62" stroke="#2A5035" stroke-width="0.5" stroke-linecap="round"/>

  <!-- Feuille à (56,44) — pointe haute -->
  <path d="M 56,44 C 42,40 24,36 12,40 C 22,48 42,50 56,44 Z"
        fill="url(#lP)" stroke="#3A6848" stroke-width="0.75"/>
  <line x1="56" y1="44" x2="15" y2="40" stroke="#2A5035" stroke-width="0.5" stroke-linecap="round"/>

  <!-- PIMENT 1 — grand habanero, pend de la sous-branche (30,80) -->
  <path d="M 30,80 C 26,88 22,96 20,104"
        fill="none" stroke="#4E8A62" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Calice -->
  <path d="M 18,104 C 17,98 18,92 20,90 C 22,92 23,98 22,104 Z" fill="#5A9068"/>
  <path d="M 16,102 C 13,96 15,89 18,89 C 18,93 17,98 16,102 Z" fill="#5A9068" fill-opacity="0.6"/>
  <path d="M 24,102 C 27,96 25,89 22,89 C 22,93 23,98 24,102 Z" fill="#5A9068" fill-opacity="0.6"/>
  <!-- Corps habanero (rond, lanterne) -->
  <path d="M 12,106 C 8,113 7,122 8,130 C 9,138 13,144 18,146 C 21,148 25,148 28,146 C 33,143 37,137 38,129 C 39,121 37,112 33,106 Z"
        fill="url(#pG)"/>
  <path d="M 12,106 C 8,113 7,122 8,130 C 9,138 13,144 18,146 C 21,148 25,148 28,146 C 33,143 37,137 38,129 C 39,121 37,112 33,106 Z"
        fill="url(#pS)"/>
  <path d="M 20,107 C 19,117 18,127 19,136 C 20,141 22,145 24,147"
        fill="none" stroke="#C03018" stroke-width="0.6" stroke-opacity="0.5" stroke-linecap="round"/>
  <ellipse cx="10" cy="122" rx="3.5" ry="6" fill="rgba(255,200,140,0.38)" transform="rotate(-10,10,122)"/>

  <!-- PIMENT 2 — plus petit, pend de (56,44) -->
  <path d="M 56,44 C 53,52 50,58 48,64"
        fill="none" stroke="#4E8A62" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Calice petit -->
  <path d="M 46,64 C 45,59 46,54 48,52 C 50,54 51,59 50,64 Z" fill="#5A9068"/>
  <path d="M 44,62 C 41,57 43,51 46,51 C 46,55 45,59 44,62 Z" fill="#5A9068" fill-opacity="0.55"/>
  <path d="M 52,62 C 55,56 53,51 50,51 C 50,55 51,59 52,62 Z" fill="#5A9068" fill-opacity="0.55"/>
  <!-- Corps petit -->
  <path d="M 41,66 C 38,72 37,80 38,87 C 39,93 42,98 45,100 C 48,98 51,93 52,87 C 53,80 52,72 49,66 Z"
        fill="url(#pG)"/>
  <path d="M 41,66 C 38,72 37,80 38,87 C 39,93 42,98 45,100 C 48,98 51,93 52,87 C 53,80 52,72 49,66 Z"
        fill="url(#pS)"/>
  <ellipse cx="39" cy="81" rx="2.5" ry="5" fill="rgba(255,200,140,0.35)" transform="rotate(-8,39,81)"/>

  <!-- ══════════════════════════════════════════════════════
       CÔTÉ DROIT — ÉPICE / AROMATIQUE (Thym-style)
       Tiges fines, petites feuilles denses, bourgeons dorés
       ══════════════════════════════════════════════════════ -->

  <!-- Bras principal droit (100,154 → 132,96) -->
  <path d="M 100,154 C 110,136 122,116 132,96"
        fill="none" stroke="#4E8A62" stroke-width="3.8" stroke-linecap="round"/>
  <!-- Extension haute-droite (132,96 → 144,44) -->
  <path d="M 132,96 C 135,78 139,62 144,44"
        fill="none" stroke="#4E8A62" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sous-branche basse-droite (132,96 → 170,80) -->
  <path d="M 132,96 C 146,90 158,84 170,80"
        fill="none" stroke="#4E8A62" stroke-width="2.2" stroke-linecap="round"/>

  <!-- FEUILLES EN GRAPPES côté herbe aromatique -->

  <!-- Grappe à (132,96) — pointe bas-droite -->
  <path d="M 132,96 C 150,102 174,114 190,120 C 178,128 152,114 132,96 Z"
        fill="url(#lH)" stroke="#4A7858" stroke-width="0.7"/>
  <line x1="132" y1="96" x2="187" y2="119" stroke="#3A6040" stroke-width="0.5" stroke-linecap="round"/>
  <ellipse cx="154" cy="110" rx="5.5" ry="2.5" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(18,154,110)"/>
  <ellipse cx="168" cy="116" rx="5"   ry="2.2" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(20,168,116)"/>

  <!-- Grappe à (132,96) — pointe haut-droite -->
  <path d="M 132,96 C 150,90 174,82 190,84 C 178,92 152,100 132,96 Z"
        fill="url(#lH)" stroke="#4A7858" stroke-width="0.7"/>
  <line x1="132" y1="96" x2="187" y2="84" stroke="#3A6040" stroke-width="0.5" stroke-linecap="round"/>
  <ellipse cx="154" cy="90" rx="5.5" ry="2.5" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(-18,154,90)"/>
  <ellipse cx="168" cy="85" rx="5"   ry="2.2" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(-20,168,85)"/>

  <!-- Paires de feuilles le long de la sous-branche (132,96 → 170,80) -->
  <ellipse cx="142" cy="94" rx="5.5" ry="2.5" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(-50,142,94)"/>
  <ellipse cx="151" cy="90" rx="5.5" ry="2.5" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(-50,151,90)"/>
  <ellipse cx="156" cy="84" rx="5"   ry="2.2" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(-52,156,84)"/>
  <ellipse cx="165" cy="80" rx="5"   ry="2.2" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(-52,165,80)"/>
  <!-- Bourgeon à la pointe de la sous-branche -->
  <circle cx="170" cy="80" r="4.5" fill="#EEE8D0" stroke="#C8C0A0" stroke-width="0.6" opacity="0.92"/>
  <circle cx="170" cy="80" r="2.2" fill="#D8A820" opacity="0.9"/>

  <!-- Paires le long de l'extension haute (132,96 → 144,44) -->
  <ellipse cx="134" cy="80" rx="5"   ry="2.2" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(-8,134,80)"/>
  <ellipse cx="144" cy="80" rx="5"   ry="2.2" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(8,144,80)"/>
  <ellipse cx="135" cy="68" rx="4.5" ry="2"   fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(-6,135,68)"/>
  <ellipse cx="145" cy="66" rx="4.5" ry="2"   fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(-40,145,66)"/>
  <ellipse cx="138" cy="56" rx="4"   ry="1.8" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(-42,138,56)"/>
  <ellipse cx="146" cy="52" rx="4"   ry="1.8" fill="url(#lH)" stroke="#4A7858" stroke-width="0.5" transform="rotate(-44,146,52)"/>
  <!-- Bourgeon à la pointe haute-droite -->
  <circle cx="144" cy="44" r="4.5" fill="#EEE8D0" stroke="#C8C0A0" stroke-width="0.6" opacity="0.92"/>
  <circle cx="144" cy="44" r="2.2" fill="#D8A820" opacity="0.9"/>

  <!-- Grappe intermédiaire à ~(138,68) — vers la droite -->
  <path d="M 138,68 C 152,64 168,60 180,62 C 170,70 154,72 138,68 Z"
        fill="url(#lH)" stroke="#4A7858" stroke-width="0.65"/>
  <line x1="138" y1="68" x2="176" y2="62" stroke="#3A6040" stroke-width="0.45" stroke-linecap="round"/>
  <ellipse cx="155" cy="65" rx="5"   ry="2.2" fill="url(#lH)" stroke="#4A7858" stroke-width="0.45" transform="rotate(-20,155,65)"/>
  <ellipse cx="166" cy="63" rx="4.5" ry="2"   fill="url(#lH)" stroke="#4A7858" stroke-width="0.45" transform="rotate(-22,166,63)"/>

</svg>
