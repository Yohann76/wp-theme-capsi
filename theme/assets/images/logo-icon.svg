<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 68" role="img" aria-label="L'Atelier Capsi">
  <defs>
    <linearGradient id="g-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#E8701A"/>
      <stop offset="40%"  stop-color="#C82A2B"/>
      <stop offset="100%" stop-color="#5A0A0A"/>
    </linearGradient>
    <radialGradient id="g-sheen" cx="80%" cy="26%" r="44%">
      <stop offset="0%"  stop-color="#FFB870" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#E8701A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- C-shaped chili: outer arc top→bottom, pointed tip, inner arc back up -->
  <path fill="url(#g-body)" d="
    M46,15
    C44,6  30,3  17,10
    C 4,17  4,27  4,34
    C 4,41  4,51 17,57
    C30,63 44,61 46,53
    L42,60
    L38,47
    C28,53 19,50 15,46
    C12,42 12,38 12,34
    C12,30 12,26 15,22
    C19,16 28,13 38,21
    Z
  "/>

  <!-- Sheen -->
  <path fill="url(#g-sheen)" d="
    M46,15
    C44,6  30,3  17,10
    C 4,17  4,27  4,34
    C 4,41  4,51 17,57
    C30,63 44,61 46,53
    L42,60
    L38,47
    C28,53 19,50 15,46
    C12,42 12,38 12,34
    C12,30 12,26 15,22
    C19,16 28,13 38,21
    Z
  "/>

  <!-- Calyx: 3 sepals at the top opening of the C, fanning to the right -->
  <ellipse cx="43" cy="17" rx="6.5" ry="2.2" fill="#2D4A3E" transform="rotate(-28 43 17)"/>
  <path fill="#2D4A3E"                d="M43,16 C46,11 48,6  49,2  C48,8  46,12 43,16 Z"/>
  <path fill="#2D4A3E" fill-opacity="0.75" d="M43,16 C47,14 51,13 54,10 C51,14 47,15 43,16 Z"/>
  <path fill="#2D4A3E" fill-opacity="0.75" d="M43,16 C46,20 48,24 48,29 C47,24 45,20 43,16 Z"/>
</svg>
